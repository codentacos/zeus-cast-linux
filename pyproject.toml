[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "zeuscast-linux"
version = "0.1.0"
description = "Linux controller for GAMDIAS LCD CPU coolers (a port of ZEUS CAST)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pyserial>=3.5", "Pillow>=10.1", "psutil>=5.9"]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]

[project.scripts]
zeuscast = "zeuscast.cli:main"

[tool.setuptools.packages.find]
include = ["zeuscast*"]
